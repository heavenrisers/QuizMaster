{% extends 'base.html' %}

{% block title %}Create Quiz - QuizMaster{% endblock %}

{% block content %}
<div class="form-page">
    <h2>Create New Quiz</h2>

    <div class="form-card">
        <form method="POST" action="{{ url_for('quiz.create_quiz') }}">
            <div class="form-group">
                <label>Quiz Title</label>
                <input type="text" name="title" placeholder="e.g. Python Basics Quiz" required>
            </div>

            <div class="form-group">
                <label>Topic</label>
                <input type="text" name="topic" placeholder="e.g. Python, DSA, DBMS" required>
            </div>

            <button type="submit" class="btn-full">Create & Add Questions →</button>
        </form>
    </div>
</div>
{% endblock %}
